<nav
    class="fixed top-0 left-0 right-0 z-50 transition-all duration-500 bg-[#0a0a0a]/95 backdrop-blur-xl border-b border-transparent">
    <div
        class="flex justify-between md:justify-around items-center px-4 md:px-8 py-4 w-full text-white bg-neutral-900/50">

        <div class="flex items-center gap-3">
            <img src="/images/logo-GdqARQRt.png" alt="" class="w-12 md:w-16">
            <div>
                <p class="text-lg md:text-xl font-bold">عدسة</p>
                <p class="text-[10px] md:text-xs text-orange-400">عالم التصوير الفوتوغرافي</p>
            </div>
        </div>


        <div class="hidden md:flex items-center gap-2 bg-neutral-900 px-4 py-2 rounded-full border border-neutral-800">
            <a routerLink="/" routerLinkActive="nav-btn rounded-4xl" [routerLinkActiveOptions]="{exact: true}"
                class="px-3 py-1.5 text-neutral-400 hover:text-white text-sm transition-colors">الرئيسية</a>
            <a routerLink="/blog" routerLinkActive="nav-btn rounded-4xl"
                class="px-3 py-1.5 text-neutral-400 hover:text-white text-sm transition-colors">المدونة</a>
            <a routerLink="/aboutUs" routerLinkActive="nav-btn rounded-4xl"
                class="px-3 py-1.5 text-neutral-400 hover:text-white text-sm transition-colors">من نحن</a>
        </div>

        <div class="hidden md:flex items-center gap-4">
            <i
                class="fa-solid fa-magnifying-glass text-neutral-500 hover:border-[#262626] hover:text-orange-500 p-3 transition-all duration-300 rounded-xl border border-transparent hover:bg-[#161616] cursor-pointer"></i>
            <a href="#" class="btn-primary rounded-full p-2 px-6">ابدأ القراءة</a>
        </div>


        <button class="md:hidden text-neutral-400 hover:text-white p-2 transition-colors cursor-pointer"
            (click)="toggleMenu()">
            <i class="fa-solid fa-bars text-2xl"></i>
        </button>
    </div>
</nav>

@if (isMobileMenuOpen()) {
<div class="fixed inset-0 z-60 bg-[#0a0a0a] flex flex-col md:hidden animate-in fade-in duration-300">

    <div class="flex justify-between items-center px-4 py-4 w-full text-white border-b border-neutral-800/50">
        <div class="flex items-center gap-3">
            <img src="/images/logo-GdqARQRt.png" alt="" class="w-12">
            <div>
                <p class="text-lg font-bold">عدسة</p>
                <p class="text-[10px] text-orange-400">عالم التصوير الفوتوغرافي</p>
            </div>
        </div>
        <button class="text-neutral-400 hover:text-white p-2 transition-colors cursor-pointer" (click)="closeMenu()">
            <i class="fa-solid fa-xmark text-2xl"></i>
        </button>
    </div>


    <div class="flex flex-col px-4 py-8 gap-3 overflow-y-auto">
        <a routerLink="/" routerLinkActive="border-orange-500/50 text-orange-500 bg-orange-500/10"
            [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()"
            class="block px-6 py-4 rounded-2xl text-neutral-400 hover:text-white font-medium transition-all border border-transparent hover:bg-neutral-900/50 text-right">
            الرئيسية
        </a>

        <a routerLink="/blog" routerLinkActive="border-orange-500/50 text-orange-500 bg-orange-500/10"
            (click)="closeMenu()"
            class="block px-6 py-4 rounded-2xl text-neutral-400 hover:text-white font-medium transition-all border border-transparent hover:bg-neutral-900/50 text-right">
            المدونة
        </a>

        <a routerLink="/aboutUs" routerLinkActive="border-orange-500/50 text-orange-500 bg-orange-500/10"
            (click)="closeMenu()"
            class="block px-6 py-4 rounded-2xl text-neutral-400 hover:text-white font-medium transition-all border border-transparent hover:bg-neutral-900/50 text-right">
            من نحن
        </a>

        <div class="mt-6 pt-6 border-t border-neutral-800/50">
            <a href="#" class="btn-primary w-full rounded-full py-4 text-center font-bold text-lg"
                (click)="closeMenu()">
                ابدأ القراءة
            </a>
        </div>
    </div>
</div>
}
