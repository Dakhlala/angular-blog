<main class="relative min-h-[85vh] flex flex-col items-center justify-center py-20 px-4 text-center overflow-hidden">
    <!-- Grid Background -->
    <div class="absolute inset-0 bg-[linear-gradient(rgba(38,38,38,0.5)_1px,transparent_1px),linear-gradient(90deg,rgba(38,38,38,0.5)_1px,transparent_1px)] bg-size-[60px_60px] opacity-50 -z-10"
        style="mask-image: radial-gradient(circle at center, black 20%, transparent 80%);"></div>

    <!-- 404 Text -->
    <h1
        class="text-[10rem] md:text-[13rem] leading-none font-extrabold text-orange-500 mb-8 select-none tracking-tight">
        404</h1>

    <!-- Icon with sad face and floating dots -->
    <div class="relative mb-12">
        <div
            class="w-24 h-24 rounded-full bg-orange-500/10 border border-orange-500/20 flex items-center justify-center relative z-10 backdrop-blur-sm mx-auto shadow-[0_0_40px_rgba(249,115,22,0.15)]">
            <i class="fa-regular fa-face-frown text-5xl text-orange-500"></i>
        </div>

        <!-- Floating dots -->
        <div
            class="absolute -top-3 -right-6 w-4 h-4 bg-orange-500 rounded-full animate-pulse shadow-[0_0_15px_rgba(249,115,22,0.8)]">
        </div>
        <div class="absolute -bottom-4 -left-8 w-3 h-3 bg-yellow-500 rounded-full animate-pulse shadow-[0_0_15px_rgba(234,179,8,0.8)]"
            style="animation-delay: 1s;"></div>
    </div>

    <!-- Title and Description -->
    <h2 class="text-3xl md:text-4xl font-bold text-white mb-6">عفواً! الصفحة غير موجودة</h2>
    <p class="text-neutral-400 max-w-lg mx-auto text-lg mb-12 leading-relaxed">
        الصفحة التي تبحث عنها غير موجودة أو تم نقلها. دعنا نعيدك إلى المسار الصحيح.
    </p>

    <!-- Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4 w-full px-4">

        <a routerLink="/"
            class="px-8 py-3.5 rounded-full font-semibold text-white bg-orange-500 hover:bg-orange-600 transition-all flex items-center justify-center gap-3 shadow-lg shadow-orange-500/20 min-w-50">
            <i class="fa-solid fa-house-chimney"></i>
            <span>الذهاب للرئيسية</span>
        </a>


        <a routerLink="/blog"
            class="px-8 py-3.5 rounded-full font-semibold text-white border border-neutral-700 bg-neutral-900/50 hover:bg-neutral-800 transition-all flex items-center justify-center gap-3 backdrop-blur-sm min-w-50">
            <i class="fa-regular fa-file-lines"></i>
            <span>تصفح المقالات</span>
        </a>
    </div>


    <div class="mt-20 pt-8 border-t border-neutral-800/50 flex flex-col items-center gap-4 w-full max-w-md">
        <p class="text-neutral-500 text-sm">قد تجد هذه مفيدة:</p>
        <div class="flex items-center gap-4 text-orange-500 text-sm font-medium">
            <a routerLink="/blog" class="hover:text-orange-400 transition-colors">المدونة</a>
            <span class="text-neutral-700 text-[10px]">●</span>
            <a routerLink="/" class="hover:text-orange-400 transition-colors">من نحن</a>
            <span class="text-neutral-700 text-[10px]">●</span>
            <a routerLink="/" class="hover:text-orange-400 transition-colors">الخصوصية</a>
        </div>
    </div>
</main>
